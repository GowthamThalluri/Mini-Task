apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: student-k8s-hpa
  namespace: student-k8s

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: student-k8s-app

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70